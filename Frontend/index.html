<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grades</title>
</head>
<body>
    <div id="app">
        <section id="loginSection">
            <h2>Login</h2>

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginButton">Login</button>

            <p id="loginMessage"></p>
        </section>        
        <section id="welcomeSection" hidden>
            <h2 id="welcomeMessage"></h2>
            <p>Your account is logged in successfully.</p>
            <button id="welcomeLogoutButton">Logout</button>
        </section>
    <div id="dashboard" hidden>
        <header>
            <h1>Student Grades</h1>
            <p>Manage student grades</p>
            <button id="logoutButton">Logout</button>
        </header>

        <section>
            <h2>Look Up a Student</h2>
            <input type="text" id="searchName" placeholder="Enter student name">
            <button id="searchButton">Search</button>
            <p id="searchResult"></p>
        </section>

        <section>
            <h2>Add a Student</h2>
            <input type="text" id="newName" placeholder="Student name">
            <input type="number" id="newGrade" placeholder="Grade">
            <button id="addButton">Add Student</button>
            <p id="message"></p>
        </section>

        <section>
            <h2>Edit a Grade</h2>
            <input type="text" id="editName" placeholder="Student name">
            <input type="number" id="editGrade" placeholder="New grade">
            <button id="editButton">Update Grade</button>
            <p id="editMessage"></p>
        </section>

        <section>
            <h2>All Students</h2>
            <button id="refreshButton">Refresh Grades</button>

            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="gradesTable">
                </tbody>
            </table>
        </section>

        </div>
    </div>
    <!-- ====================================== -->

        <!-- ====================================== -->
        <!-- TEMPORARY WELCOME SCREEN              -->

            <h2 id="welcomeMessage"></h2>
            <p>Your account is logged in successfully.</p>
            <button id="welcomeLogoutButton">Logout</button>
        </section>

    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
